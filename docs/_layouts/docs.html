<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090c">
  <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | default: 'Veil developer documentation' }}">
  <link rel="stylesheet" href="{{ '/assets/docs.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="mark"></span>Veil</a>
      <div class="nav-links">
        <a href="{{ '/developer.html' | relative_url }}">Developer Docs</a>
        <a href="https://github.com/veil-runtime/veil">GitHub</a>
      </div>
    </nav>
  </header>
  <main class="docs-shell">
    <article class="docs-content">
      {{ content }}
    </article>
  </main>
  <footer class="site-footer">
    <a href="{{ '/developer.html' | relative_url }}">Developer Docs</a>
    <span>Veil v0.1.3</span>
  </footer>
</body>
</html>
