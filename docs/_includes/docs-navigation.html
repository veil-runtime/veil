{% for section in site.data.navigation.sections %}
  {% if section.home %}
    {% for nav_item in section.pages %}
      <a class="docs-home{% if nav_item.url == page.url %} is-active{% endif %}" href="{{ nav_item.url | relative_url }}">Developer Docs</a>
    {% endfor %}
  {% else %}
    <section class="docs-nav-section">
      <h2>{{ section.title }}</h2>
      <ul>
        {% for nav_item in section.pages %}
          <li><a class="{% if nav_item.url == page.url %}is-active{% endif %}" href="{{ nav_item.url | relative_url }}">{{ nav_item.title }}</a></li>
        {% endfor %}
      </ul>
    </section>
  {% endif %}
{% endfor %}
